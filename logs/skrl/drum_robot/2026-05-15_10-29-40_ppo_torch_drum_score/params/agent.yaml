seed: 42
models:
  policy:
    class: GaussianMixin
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 160
      - 128
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: OBSERVATIONS
      layers:
      - 256
      - 160
      - 128
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 64
  learning_epochs: 4
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0001
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.001
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.1
  time_limit_bootstrap: false
  experiment:
    directory: /home/shy/RL_workspace/IsaacLab/source/extensions/drum_robot/logs/skrl/drum_robot
    experiment_name: 2026-05-15_10-29-40_ppo_torch_drum_score
    write_interval: auto
    checkpoint_interval: auto
trainer:
  class: SequentialTrainer
  timesteps: 5000000
  environment_info: log
  close_environment_at_exit: false
